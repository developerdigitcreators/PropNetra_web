name: Deploy production build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and copy to prop_f
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Write production env
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          API_BASE_URL="${API_BASE_URL:-}"
          NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-$API_BASE_URL}"
          cat > .env.production <<EOF
          API_BASE_URL=${API_BASE_URL}
          NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
          NEXT_PUBLIC_SITE_HOST=propnetra.devsol.in
          NEXT_PUBLIC_SHARE_DOMAIN=168-144-88-78.sslip.io
          NEXT_PUBLIC_SHARE_SITE_URL=https://168-144-88-78.sslip.io
          EOF

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Project
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SITE_HOST: propnetra.devsol.in
          NEXT_PUBLIC_SHARE_DOMAIN: 168-144-88-78.sslip.io
          NEXT_PUBLIC_SHARE_SITE_URL: https://168-144-88-78.sslip.io
        run: npm run build

      - name: Copy production build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: ".next,package.json,package-lock.json,public,next.config.mjs,ecosystem.config.cjs,.env.production"
          target: /home/ubuntu/prop_f

      - name: Install deps and restart PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/ubuntu/prop_f
            npm ci --omit=dev --legacy-peer-deps
            pm2 restart 0 || pm2 start ecosystem.config.cjs
            pm2 save
